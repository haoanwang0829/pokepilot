<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>新增队伍 - PokePilot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 48px;
            background: #2d2d2d;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
        }
        .header h1 { font-size: 16px; font-weight: 600; }
        .header .back-link {
            color: #4fc3f7;
            text-decoration: none;
            font-size: 13px;
            white-space: nowrap;
        }
        .form-card {
            max-width: 560px;
            margin: 0 auto;
            padding: 16px 14px 40px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 14px; color: #bbb; }
        .field label .req { color: #f44336; margin-left: 2px; }
        .field label .hint { font-size: 12px; color: #666; margin-left: 6px; }
        .field input, .field textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            background: #252526;
            color: #e0e0e0;
            font-size: 16px;
            outline: none;
        }
        .field input:focus, .field textarea:focus { border-color: #4fc3f7; }
        .field textarea {
            min-height: 200px;
            font-family: 'SF Mono', Consolas, Menlo, monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }
        .btn {
            padding: 13px;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            background: #2d2d2d;
            color: #e0e0e0;
            font-size: 16px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary { background: #0e639c; border-color: #0e639c; color: #fff; }
        .btn-primary:active { background: #1177bb; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .message { font-size: 14px; display: none; padding: 10px 12px; border-radius: 6px; }
        .message.error { color: #f44336; background: #2d1a1a; border: 1px solid #5a2a2a; }
        .message.info { color: #ffa726; background: #2d241a; border: 1px solid #5a452a; }
        .message.success { color: #7bc67e; background: #1a2d1c; border: 1px solid #2a5a2e; }
        .preview-title { font-size: 14px; color: #bbb; }
        .preview-count { font-size: 12px; color: #888; }
        .poke-card {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .poke-head { display: flex; align-items: center; gap: 10px; }
        .poke-sprite {
            width: 44px; height: 44px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: #1e1e1e;
            border-radius: 6px;
            overflow: hidden;
        }
        .poke-sprite img { max-width: 100%; max-height: 100%; }
        .poke-sprite.empty { color: #555; font-size: 12px; }
        .poke-name { font-size: 16px; font-weight: 600; }
        .poke-sub { font-size: 12px; color: #888; }
        .poke-meta { font-size: 13px; color: #ccc; display: flex; flex-wrap: wrap; gap: 4px 12px; }
        .poke-meta b { color: #e0e0e0; font-weight: 500; }
        .poke-moves { font-size: 13px; color: #ccc; display: flex; flex-wrap: wrap; gap: 4px 10px; }
        .unresolved-list { display: flex; flex-direction: column; gap: 6px; }
        .unresolved-item { font-size: 13px; color: #f44336; }
    </style>
</head>
<body>
    <div class="header">
        <a class="back-link" href="/team">← 返回</a>
        <h1>新增队伍</h1>
    </div>
    <div class="form-card">
        <div class="message" id="message"></div>
        <div class="field">
            <label>队伍ID<span class="req">*</span></label>
            <input type="text" id="team_id" placeholder="如 MB608" autocomplete="off">
        </div>
        <div class="field">
            <label>队伍名称<span class="req">*</span></label>
            <input type="text" id="team_name" placeholder="队伍名称（存 Full_Name）" autocomplete="off">
        </div>
        <div class="field">
            <label>队伍描述</label>
            <input type="text" id="team_desc" placeholder="队伍描述（存 Team_Description）" autocomplete="off">
        </div>
        <div class="field">
            <label>来源连接</label>
            <input type="text" id="source_link" placeholder="如 https://x.com/..." autocomplete="off">
        </div>
        <div class="field">
            <label>分享日期</label>
            <input type="date" id="date_shared">
        </div>
        <div class="field">
            <label>冠军队伍码<span class="hint">选填，填了 Replica_Status 记为 Y</span></label>
            <input type="text" id="replica_code" placeholder="复制粘贴队伍码" autocomplete="off">
        </div>
        <div class="field">
            <label>所有者<span class="hint">选填</span></label>
            <input type="text" id="owner" placeholder="玩家 ID / 用户名" autocomplete="off">
        </div>
        <div class="field">
            <label>赛事<span class="hint">选填</span></label>
            <input type="text" id="event" placeholder="如 Indianapolis Regional 2026" autocomplete="off">
        </div>
        <div class="field">
            <label>名次<span class="hint">选填</span></label>
            <input type="text" id="rank" placeholder="如 Champion / Top 8" autocomplete="off">
        </div>
        <div class="field">
            <label>Pokepaste 链接<span class="hint">选填</span></label>
            <input type="text" id="pokepaste_url" placeholder="https://pokepast.es/..." autocomplete="off">
        </div>
        <div class="field">
            <label>Showdown 队伍文本<span class="req">*</span></label>
            <textarea id="paste" placeholder="从 pokepaste 页面复制的队伍文本，按空行分隔的 6 只宝可梦..."></textarea>
        </div>
        <button class="btn" id="parse-btn" onclick="doParse()">解析预览</button>
        <div id="preview"></div>
        <button class="btn btn-primary" id="save-btn" onclick="doSave()" disabled>保存队伍</button>
    </div>
    <script>
        const NATURE_ZH = {
            Hardy: '勤奋', Lonely: '寂寞', Brave: '勇敢', Adamant: '固执',
            Naughty: '调皮', Bold: '大胆', Docile: '坦率', Relaxed: '悠闲',
            Impish: '淘气', Lax: '乐天', Timid: '胆小', Hasty: '急躁',
            Serious: '认真', Jolly: '爽朗', Naive: '天真', Modest: '内敛',
            Mild: '慢吞吞', Quiet: '冷静', Bashful: '害羞', Rash: '马虎',
            Calm: '温和', Gentle: '温顺', Sassy: '自大', Careful: '慎重',
            Quirky: '浮躁'
        };
        const EV_LABELS = [
            { key: 'hp', label: 'HP' }, { key: 'attack', label: '攻击' },
            { key: 'defense', label: '防御' }, { key: 'sp_atk', label: '特攻' },
            { key: 'sp_def', label: '特防' }, { key: 'speed', label: '速度' }
        ];
        let parsed = null;

        function showMessage(text, type) {
            const el = document.getElementById('message');
            if (!text) { el.style.display = 'none'; el.textContent = ''; return; }
            el.className = 'message ' + (type || 'info');
            el.textContent = text;
            el.style.display = '';
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function evsText(evs) {
            if (!evs) return '';
            return EV_LABELS.filter(({ key }) => (evs[key] || 0) !== 0)
                .map(({ key, label }) => label + ' ' + evs[key]).join(' / ');
        }

        function renderPreview(data) {
            const el = document.getElementById('preview');
            const pokes = data.pokemon || [];
            const unresolved = data.unresolved || [];
            let html = `<div class="preview-title">解析结果
                <span class="preview-count">${data.count || 0} 只${data.evs_present ? ' · 含EV' : ''} · form_ids: ${esc(data.form_ids || '')}</span></div>`;
            if (unresolved.length) {
                html += `<div class="unresolved-list" style="margin-top:8px">
                    <div class="unresolved-item" style="font-size:14px;color:#f44336">以下宝可梦无法解析（保存会被拒绝）：</div>`;
                unresolved.forEach(u => {
                    html += `<div class="unresolved-item">${esc(u.name)}</div>`;
                });
                html += '</div>';
            }
            pokes.forEach(p => {
                const nature = NATURE_ZH[p.nature] ? NATURE_ZH[p.nature] + ' ' + p.nature : (p.nature || '');
                const evs = evsText(p.evs);
                html += `
                <div class="poke-card" style="margin-top:8px">
                    <div class="poke-head">
                        <div class="poke-sprite">${p.sprite
                            ? `<img src="/sprites/${p.sprite.replace(/^sprites\//, '')}" alt="" loading="lazy">`
                            : '<div class="poke-sprite empty">?</div>'}</div>
                        <div>
                            <div class="poke-name">${esc(p.name_zh || p.name)}</div>
                            <div class="poke-sub">${esc(p.name)} · ${esc(p.form_id)}${p.level ? ' · Lv' + p.level : ''}</div>
                        </div>
                    </div>
                    <div class="poke-meta">
                        ${p.item ? `<span>道具 <b>${esc(p.item)}</b></span>` : ''}
                        ${p.ability ? `<span>特性 <b>${esc(p.ability)}</b></span>` : ''}
                        ${nature ? `<span>性格 <b>${esc(nature)}</b></span>` : ''}
                        ${evs ? `<span>EV <b>${esc(evs)}</b></span>` : ''}
                    </div>
                    <div class="poke-moves">${(p.moves || []).map(m => `<span>· ${esc(m)}</span>`).join('') || ''}</div>
                </div>`;
            });
            el.innerHTML = html || '<div class="preview-title" style="margin-top:8px;color:#888">没有解析到宝可梦</div>';
        }

        async function doParse() {
            const paste = document.getElementById('paste').value;
            if (!paste.trim()) { showMessage('请先粘贴队伍文本', 'error'); return; }
            showMessage('');
            try {
                const res = await fetch('/api/teams/library/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paste })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || '解析失败');
                parsed = data;
                renderPreview(data);
                const saveBtn = document.getElementById('save-btn');
                saveBtn.disabled = (data.unresolved || []).length > 0 || !(data.pokemon || []).length;
                if (data.unresolved && data.unresolved.length) {
                    showMessage('存在无法解析的宝可梦，请修正文本后再保存', 'error');
                }
            } catch (e) {
                showMessage('解析出错: ' + e.message, 'error');
            }
        }

        async function doSave() {
            if (!parsed) { showMessage('请先点击「解析预览」', 'error'); return; }
            const team_id = document.getElementById('team_id').value.trim();
            const team_name = document.getElementById('team_name').value.trim();
            if (!team_id || !team_name) { showMessage('请填写队伍ID和队伍名称', 'error'); return; }
            if (!(parsed.pokemon || []).length) { showMessage('请先解析出宝可梦', 'error'); return; }
            const body = {
                team_id,
                name: team_name,
                description: document.getElementById('team_desc').value.trim(),
                source_link: document.getElementById('source_link').value.trim(),
                date_shared: document.getElementById('date_shared').value.trim(),
                replica_code: document.getElementById('replica_code').value.trim(),
                owner: document.getElementById('owner').value.trim(),
                event: document.getElementById('event').value.trim(),
                rank: document.getElementById('rank').value.trim(),
                pokepaste: document.getElementById('pokepaste_url').value.trim(),
                paste: document.getElementById('paste').value
            };
            showMessage('');
            try {
                const res = await fetch('/api/teams/library/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || '保存失败');
                showMessage(
                    `保存成功${data.overwrote ? '（覆盖已有队伍）' : ''}：${data.team_id}，${data.count} 只宝可梦，已追加到 teaminfo.txt`,
                    'success');
                document.getElementById('team_id').value = '';
                document.getElementById('paste').value = '';
                document.getElementById('preview').innerHTML = '';
                parsed = null;
                document.getElementById('save-btn').disabled = true;
            } catch (e) {
                showMessage('保存出错: ' + e.message, 'error');
            }
        }
    </script>
</body>
</html>
