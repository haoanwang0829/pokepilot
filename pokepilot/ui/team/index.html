<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冠军队伍库 - PokePilot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        .container { display: flex; flex-direction: column; height: 100vh; }
        .header {
            height: 40px;
            background: #2d2d2d;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
            gap: 12px;
        }
        .header h1 { font-size: 16px; font-weight: 600; color: #e0e0e0; }
        .header .count { font-size: 13px; color: #888; }
        .header .back-link {
            margin-left: auto;
            color: #4fc3f7;
            text-decoration: none;
            font-size: 13px;
        }
        .header .back-link:hover { text-decoration: underline; }
        .filter-bar {
            padding: 8px 16px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            flex-shrink: 0;
            position: relative;
        }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-row input {
            width: 150px;
            padding: 6px 10px;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            background: #1e1e1e;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        .filter-row input:focus { border-color: #4fc3f7; }
        .filter-row input::placeholder { color: #666; }
        .btn {
            padding: 6px 16px;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            background: #2d2d2d;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
        }
        .btn:hover { background: #383838; border-color: #4fc3f7; }
        .btn-primary { background: #0e639c; border-color: #0e639c; color: #fff; }
        .btn-primary:hover { background: #1177bb; }
        .filter-hint { font-size: 11px; color: #666; margin-left: 4px; }
        .filter-dropdown {
            position: absolute;
            z-index: 100;
            display: none;
            max-height: 280px;
            overflow-y: auto;
            background: #252526;
            border: 1px solid #4a4a50;
            border-radius: 4px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
            padding: 4px 0;
        }
        .filter-dropdown::-webkit-scrollbar { width: 8px; }
        .filter-dropdown::-webkit-scrollbar-track { background: #1e1e1e; }
        .filter-dropdown::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .filter-dropdown::-webkit-scrollbar-thumb:hover { background: #6a6a72; }
        .filter-dropdown .opt {
            padding: 5px 10px;
            font-size: 13px;
            color: #e0e0e0;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .filter-dropdown .opt:hover,
        .filter-dropdown .opt.highlight { background: #0e639c; color: #fff; }
        .filter-dropdown .no-result {
            padding: 6px 10px;
            font-size: 12px;
            color: #888;
        }
        .message { padding: 6px 16px; font-size: 13px; display: none; flex-shrink: 0; }
        .message.error { color: #f44336; background: #2d1a1a; border-bottom: 1px solid #5a2a2a; }
        .message.info { color: #ffa726; background: #2d241a; border-bottom: 1px solid #5a452a; }
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .list-container::-webkit-scrollbar { width: 8px; }
        .list-container::-webkit-scrollbar-track { background: #1e1e1e; }
        .list-container::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .team-row {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 8px;
        }
        .team-row-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            font-size: 13px;
            color: #ddd;
            flex-wrap: wrap;
        }
        .team-id {
            font-size: 11px;
            color: #4fc3f7;
            background: rgba(79, 195, 247, 0.12);
            border: 1px solid rgba(79, 195, 247, 0.35);
            border-radius: 3px;
            padding: 1px 6px;
            flex-shrink: 0;
        }
        .team-title {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        .team-code {
            font-size: 13px;
            color: #4caf50;
            font-family: Consolas, monospace;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .team-code .copy-btn {
            font-size: 11px;
            padding: 1px 8px;
            border: 1px solid rgba(76, 175, 80, 0.5);
            border-radius: 3px;
            background: transparent;
            color: #4caf50;
            cursor: pointer;
        }
        .team-code .copy-btn:hover { background: rgba(76, 175, 80, 0.15); }
        .team-date { font-size: 12px; color: #888; flex-shrink: 0; }
        .team-source {
            font-size: 12px;
            color: #4fc3f7;
            text-decoration: none;
            flex-shrink: 0;
        }
        .team-source:hover { text-decoration: underline; }
        .team-row-meta { font-size: 11px; color: #888; margin-bottom: 6px; }
        .team-cards {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        .team-card {
            display: flex;
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 4px;
            min-width: 0;
        }
        .team-card-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 76px;
            flex-shrink: 0;
        }
        .team-card-sprite {
            width: 56px;
            height: 56px;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .team-card-sprite.empty { display: block; }
        .team-card-name {
            font-size: 11px;
            color: #ddd;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .team-card-meta {
            font-size: 9px;
            color: #999;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.4;
        }
        .team-card-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            justify-content: center;
        }
        .team-card-move {
            font-size: 10px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 3px;
            padding: 2px 5px;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }
        .team-card-move-icon {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .team-card-move-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .type-normal { background: #A8A878; }
        .type-fighting { background: #C03028; }
        .type-flying { background: #A890F0; }
        .type-poison { background: #A040A0; }
        .type-ground { background: #E0C068; }
        .type-rock { background: #B8A038; }
        .type-bug { background: #A8B820; }
        .type-ghost { background: #705898; }
        .type-steel { background: #B8B8D0; }
        .type-fire { background: #F08030; }
        .type-water { background: #6890F0; }
        .type-grass { background: #78C850; }
        .type-electric { background: #F8D030; }
        .type-psychic { background: #F85888; }
        .type-ice { background: #98D8D8; }
        .type-dragon { background: #7038F8; }
        .type-dark { background: #705848; }
        .type-fairy { background: #EE99AC; }
        .team-card-evs {
            width: 50px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
            justify-content: center;
            border-left: 1px solid #2d2d30;
            padding-left: 6px;
        }
        .team-card-ev {
            font-size: 11px;
            color: #ddd;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            line-height: 1.4;
        }
        .empty-text { text-align: center; color: #888; font-size: 14px; padding: 40px 0; }
        .pagination {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background: #252526;
            border-top: 1px solid #3e3e42;
            font-size: 13px;
            color: #ccc;
        }
        .pagination .page-btn {
            min-width: 28px;
            padding: 3px 8px;
            border: 1px solid #3e3e42;
            border-radius: 3px;
            background: #2d2d2d;
            color: #ddd;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }
        .pagination .page-btn:hover:not(:disabled) { border-color: #4fc3f7; }
        .pagination .page-btn:disabled { opacity: 0.4; cursor: default; }
        .pagination .page-btn.current {
            background: #0e639c;
            border-color: #0e639c;
            color: #fff;
        }
        @media (max-width: 1200px) {
            .team-cards { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>冠军队伍库</h1>
            <span class="count" id="total-count">加载中...</span>
            <a class="back-link" href="/">← 返回主页</a>
        </div>
        <div class="filter-bar">
            <div class="filter-row">
                <input type="text" id="f1" placeholder="宝可梦 1">
                <input type="text" id="f2" placeholder="宝可梦 2">
                <input type="text" id="f3" placeholder="宝可梦 3">
                <input type="text" id="f4" placeholder="宝可梦 4">
                <input type="text" id="f5" placeholder="宝可梦 5">
                <input type="text" id="f6" placeholder="宝可梦 6">
                <button class="btn btn-primary" onclick="applyFilter()">筛选</button>
                <button class="btn" onclick="resetFilter()">重置</button>
                <span class="filter-hint">支持中文/英文名（如 雷丘、dragonite），多只需全部包含</span>
            </div>
            <div class="filter-dropdown" id="filter-dropdown"></div>
        </div>
        <div class="message" id="message"></div>
        <div class="list-container" id="list-container">
            <div class="empty-text">加载中...</div>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
    <script>
        const TYPE_ID_MAP = {
            'Normal': 1, 'Fighting': 2, 'Flying': 3, 'Poison': 4,
            'Ground': 5, 'Rock': 6, 'Bug': 7, 'Ghost': 8,
            'Steel': 9, 'Fire': 10, 'Water': 11, 'Grass': 12,
            'Electric': 13, 'Psychic': 14, 'Ice': 15, 'Dragon': 16,
            'Dark': 17, 'Fairy': 18
        };
        const NATURE_ZH = {
            Hardy: '勤奋', Lonely: '寂寞', Brave: '勇敢', Adamant: '固执',
            Naughty: '调皮', Bold: '大胆', Docile: '坦率', Relaxed: '悠闲',
            Impish: '淘气', Lax: '乐天', Timid: '胆小', Hasty: '急躁',
            Serious: '认真', Jolly: '爽朗', Naive: '天真', Modest: '内敛',
            Mild: '慢吞吞', Quiet: '冷静', Bashful: '害羞', Rash: '马虎',
            Calm: '温和', Gentle: '温顺', Sassy: '自大', Careful: '慎重',
            Quirky: '浮躁'
        };
        const EV_LABELS = [
            { key: 'hp', label: 'HP' }, { key: 'attack', label: 'A' },
            { key: 'defense', label: 'D' }, { key: 'sp_atk', label: 'SA' },
            { key: 'sp_def', label: 'SD' }, { key: 'speed', label: 'S' }
        ];
        const PAGE_SIZE = 20;
        let currentPage = 1;
        let totalPages = 1;

        function showMessage(text, type) {
            const el = document.getElementById('message');
            if (!text) { el.style.display = 'none'; el.textContent = ''; return; }
            el.className = 'message ' + (type || 'info');
            el.textContent = text;
            el.style.display = '';
        }

        function typeIcon(typeName, cls) {
            const key = String(typeName || '').charAt(0).toUpperCase() + String(typeName || '').slice(1);
            const id = TYPE_ID_MAP[key] || 1;
            return `<div class="${cls}" title="${key}" style="background-image:url('/sprites/sprites/types/generation-ix/scarlet-violet/small/${id}.png')"></div>`;
        }

        function natureToZh(n) { return NATURE_ZH[n] || n || '-'; }

        function renderEvs(evs) {
            if (!evs || !Object.keys(evs).length) return '<div class="team-card-meta">无</div>';
            const rows = EV_LABELS.filter(({ key }) => (evs[key] ?? 0) !== 0)
                .map(({ key, label }) => `<div class="team-card-ev"><span>${label}</span><span>${evs[key]}</span></div>`);
            return rows.length ? rows.join('') : '<div class="team-card-meta">无</div>';
        }

        function renderPokeCard(p) {
            if (!p) return '<div class="team-card"></div>';
            const spritePath = (p.sprite || '').replace(/^sprites\//, '');
            const spriteHtml = spritePath
                ? `<img class="team-card-sprite" src="/sprites/${spritePath}" alt="" loading="lazy">`
                : '<div class="team-card-sprite empty"></div>';
            const nameZh = p.name_zh || p.name || '';
            const nature = natureToZh(p.nature);
            const item = p.item_zh || p.item || '无道具';
            const ability = p.ability_zh || p.ability || '-';
            const moves = (p.moves || []).map(m => {
                const typeKey = String(m.type || 'normal').toLowerCase();
                return `<div class="team-card-move type-${typeKey}" title="${(m.name_zh || m.name || '').replace(/"/g, '&quot;')}">${typeIcon(m.type, 'team-card-move-icon')}<span class="team-card-move-name">${m.name_zh || m.name}</span></div>`;
            }).join('') || '<div class="team-card-move type-normal"><span class="team-card-move-name">-</span></div>';
            return `
                <div class="team-card">
                    <div class="team-card-left">
                        ${spriteHtml}
                        <div class="team-card-name" title="${nameZh.replace(/"/g, '&quot;')}">${nameZh}</div>
                        <div class="team-card-meta" title="${nature}">${nature}</div>
                        <div class="team-card-meta" title="${item.replace(/"/g, '&quot;')}">${item}</div>
                        <div class="team-card-meta" title="${ability.replace(/"/g, '&quot;')}">${ability}</div>
                    </div>
                    <div class="team-card-right">${moves}</div>
                    <div class="team-card-evs">${renderEvs(p.evs)}</div>
                </div>`;
        }

        async function copyCode(code, btn) {
            try {
                await navigator.clipboard.writeText(code);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = code;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            }
            if (btn) {
                const old = btn.textContent;
                btn.textContent = '已复制';
                setTimeout(() => { btn.textContent = old; }, 1200);
            }
        }

        function renderTeams(data) {
            const container = document.getElementById('list-container');
            const teams = data.teams || [];
            if (!teams.length) {
                container.innerHTML = '<div class="empty-text">没有符合条件的队伍</div>';
                return;
            }
            container.innerHTML = teams.map(t => {
                const meta = [t.owner, t.event, t.rank].filter(v => v && v !== '-').join(' · ');
                const src = t.link && t.link !== '-' ? `<a class="team-source" href="${t.link}" target="_blank" rel="noopener">来源</a>` : '';
                return `
                    <div class="team-row">
                        <div class="team-row-header">
                            <span class="team-id">${t.team_id}</span>
                            <span class="team-title" title="${(t.title || '').replace(/"/g, '&quot;')}">${t.title || '(无标题)'}</span>
                            <span class="team-code" title="点击复制冠军队伍码">${t.replica_code || '-'}<button class="copy-btn" onclick="copyCode('${t.replica_code}', this)">复制</button></span>
                            <span class="team-date">${t.date_shared || ''}</span>
                            ${src}
                        </div>
                        <div class="team-row-meta">${meta}</div>
                        <div class="team-cards">${(t.roster || []).map(renderPokeCard).join('')}</div>
                    </div>`;
            }).join('');
        }

        function renderPagination(total) {
            const el = document.getElementById('pagination');
            totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (totalPages <= 1) { el.innerHTML = ''; return; }
            let buttons = '';
            for (let p = 1; p <= totalPages; p++) {
                if (totalPages > 9 && p > 2 && p < totalPages - 1 && Math.abs(p - currentPage) > 2) {
                    if (p === 3 || p === totalPages - 2) buttons += '<span style="color:#666">…</span>';
                    continue;
                }
                buttons += `<button class="page-btn ${p === currentPage ? 'current' : ''}" onclick="goPage(${p})">${p}</button>`;
            }
            el.innerHTML = `
                <button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>
                ${buttons}
                <button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;
        }

        function applyFilter() {
            showMessage('');
            goPage(1);
        }

        function resetFilter() {
            for (let i = 1; i <= 6; i++) document.getElementById('f' + i).value = '';
            showMessage('');
            goPage(1);
        }

        function goPage(page) {
            if (page < 1 || (totalPages && page > totalPages)) return;
            currentPage = page;
            const params = new URLSearchParams({ page: currentPage, page_size: PAGE_SIZE });
            for (let i = 1; i <= 6; i++) {
                const v = document.getElementById('f' + i).value.trim();
                if (v) params.set('p' + i, v);
            }
            document.getElementById('total-count').textContent = '加载中...';
            const container = document.getElementById('list-container');
            container.innerHTML = '<div class="empty-text">加载中...</div>';
            fetch('/api/teams/library?' + params.toString())
                .then(r => r.json())
                .then(data => {
                    if (!data.success) {
                        showMessage(data.error || '查询失败', 'error');
                        document.getElementById('total-count').textContent = '—';
                        container.innerHTML = '<div class="empty-text">暂无结果</div>';
                        document.getElementById('pagination').innerHTML = '';
                        return;
                    }
                    showMessage('');
                    document.getElementById('total-count').textContent = `共 ${data.total} 支队伍`;
                    renderTeams(data);
                    renderPagination(data.total);
                })
                .catch(err => {
                    showMessage('请求失败: ' + err.message, 'error');
                    document.getElementById('total-count').textContent = '—';
                    container.innerHTML = '<div class="empty-text">加载失败</div>';
                });
        }

        let speciesNames = [];
        let dropdownInput = null;
        let dropdownItems = [];
        let dropdownIndex = -1;

        async function loadSpeciesList() {
            try {
                const res = await fetch('/api/data/pokemon-list');
                const data = await res.json();
                if (!data.success) return;
                const seen = new Set();
                const names = [];
                data.pokemon.forEach(p => {
                    if (p.name_zh && !seen.has(p.name_zh)) {
                        seen.add(p.name_zh);
                        names.push(p.name_zh);
                    }
                });
                names.sort((a, b) => a.localeCompare(b, 'zh-CN'));
                speciesNames = names;
            } catch (e) { /* 联想失败不阻塞使用 */ }
        }

        function filterDropdownItems() {
            if (!dropdownInput) return [];
            const q = dropdownInput.value.trim().toLowerCase();
            if (!q) return speciesNames.slice(0, 200);
            return speciesNames.filter(n => n.toLowerCase().includes(q)).slice(0, 200);
        }

        function positionDropdown() {
            const dd = document.getElementById('filter-dropdown');
            const bar = document.querySelector('.filter-bar');
            if (!dd || !bar || !dropdownInput) return;
            const ir = dropdownInput.getBoundingClientRect();
            const br = bar.getBoundingClientRect();
            const width = Math.max(ir.width, 150);
            const left = Math.max(0, Math.min(ir.left - br.left, br.width - width));
            dd.style.left = left + 'px';
            dd.style.top = (ir.bottom - br.top + 4) + 'px';
            dd.style.minWidth = width + 'px';
        }

        function renderDropdown() {
            const dd = document.getElementById('filter-dropdown');
            dropdownItems = filterDropdownItems();
            if (!dropdownItems.length) {
                dd.innerHTML = '<div class="no-result">无匹配宝可梦</div>';
                return;
            }
            dd.innerHTML = dropdownItems.map((n, i) =>
                `<div class="opt${i === dropdownIndex ? ' highlight' : ''}" data-idx="${i}" title="${n.replace(/"/g, '&quot;')}">${n}</div>`).join('');
        }

        function openDropdown(input) {
            dropdownInput = input;
            dropdownIndex = -1;
            positionDropdown();
            renderDropdown();
            document.getElementById('filter-dropdown').style.display = 'block';
        }

        function closeDropdown() {
            const dd = document.getElementById('filter-dropdown');
            dd.style.display = 'none';
            dropdownInput = null;
            dropdownItems = [];
            dropdownIndex = -1;
        }

        function selectDropdownItem(index) {
            if (!dropdownItems.length) return;
            const i = index >= 0 ? index : 0;
            if (i < 0 || i >= dropdownItems.length) return;
            if (dropdownInput) {
                dropdownInput.value = dropdownItems[i];
                dropdownInput.focus();
            }
            closeDropdown();
        }

        function scrollHighlight() {
            const el = document.querySelector('#filter-dropdown .opt.highlight');
            if (el) el.scrollIntoView({ block: 'nearest' });
        }

        function onFilterKeydown(e) {
            const dd = document.getElementById('filter-dropdown');
            if (dd.style.display === 'none') {
                if (e.key === 'Enter') applyFilter();
                return;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                dropdownIndex = Math.min(dropdownIndex + 1, dropdownItems.length - 1);
                renderDropdown();
                scrollHighlight();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                dropdownIndex = Math.max(dropdownIndex - 1, 0);
                renderDropdown();
                scrollHighlight();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (dropdownItems.length) selectDropdownItem(dropdownIndex);
                else applyFilter();
            } else if (e.key === 'Escape') {
                closeDropdown();
            }
        }

        function setupFilterDropdown() {
            document.querySelectorAll('.filter-row input').forEach(input => {
                input.addEventListener('focus', () => { openDropdown(input); });
                input.addEventListener('input', () => { openDropdown(input); });
                input.addEventListener('keydown', onFilterKeydown);
                input.addEventListener('blur', () => { setTimeout(closeDropdown, 150); });
            });
            const dd = document.getElementById('filter-dropdown');
            dd.addEventListener('click', (e) => {
                const opt = e.target.closest('.opt');
                if (opt) selectDropdownItem(parseInt(opt.dataset.idx, 10));
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.filter-row') && !e.target.closest('#filter-dropdown')) closeDropdown();
            });
        }

        setupFilterDropdown();
        loadSpeciesList();
        goPage(1);
    </script>
</body>
</html>
