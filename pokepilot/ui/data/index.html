<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝可梦数据一览 - PokePilot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            height: 40px;
            background: #2d2d2d;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
            gap: 12px;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
        }
        .header .count {
            font-size: 13px;
            color: #888;
        }
        .header .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .header select {
            padding: 3px 8px;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            background: #1e1e1e;
            color: #e0e0e0;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .header select:focus {
            border-color: #4fc3f7;
        }
        .header .format-group {
            display: flex;
            gap: 0;
        }
        .header .format-group label {
            padding: 3px 10px;
            border: 1px solid #3e3e42;
            background: #1e1e1e;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .header .format-group label:first-child {
            border-radius: 4px 0 0 4px;
        }
        .header .format-group label:last-child {
            border-radius: 0 4px 4px 0;
            border-left: none;
        }
        .header .format-group input[type="radio"] {
            display: none;
        }
        .header .format-group input[type="radio"]:checked + span {
            color: #e0e0e0;
        }
        .header .format-group label:has(input:checked) {
            background: #4fc3f7;
            color: #1e1e1e;
            border-color: #4fc3f7;
        }
        .header .format-group label:has(input:checked) + label {
            border-left-color: #4fc3f7;
        }
        .header .back-link {
            margin-left: auto;
            color: #4fc3f7;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }
        .header .back-link:hover {
            text-decoration: underline;
        }
        .search-bar {
            padding: 10px 16px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            flex-shrink: 0;
        }
        .search-bar input {
            width: 100%;
            padding: 6px 12px;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            background: #1e1e1e;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        .search-bar input:focus {
            border-color: #4fc3f7;
        }
        .grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .grid-container::-webkit-scrollbar {
            width: 8px;
        }
        .grid-container::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #2d2d2d;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
            color: inherit;
        }
        .card:hover {
            background: #383838;
            border-color: #4fc3f7;
        }
        .card .idx {
            font-size: 12px;
            color: #888;
            min-width: 28px;
            text-align: right;
            flex-shrink: 0;
        }
        .card .sprite {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card .sprite img {
            max-width: 48px;
            max-height: 48px;
            image-rendering: pixelated;
        }
        .card .sprite .no-img {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 10px;
        }
        .card .name {
            font-size: 14px;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .loading, .error {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #888;
        }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>宝可梦数据一览</h1>
            <span class="count" id="total-count">加载中...</span>
            <div class="controls">
                <select id="season-select" onchange="onSeasonFormatChange()">
                </select>
                <div class="format-group">
                    <label><input type="radio" name="format" value="double" checked onchange="onSeasonFormatChange()"><span>双打</span></label>
                    <label><input type="radio" name="format" value="single" onchange="onSeasonFormatChange()"><span>单打</span></label>
                </div>
            </div>
            <a class="back-link" href="/">← 返回主页</a>
        </div>
        <div class="search-bar">
            <input type="text" id="search" placeholder="搜索宝可梦名称（中文/英文）..." oninput="filterList()">
        </div>
        <div class="grid-container">
            <div class="loading" id="loading">加载中...</div>
            <div class="grid" id="pokemon-grid"></div>
        </div>
    </div>
    <script>
        let allPokemon = [];
        let currentSeason = '';
        let currentFormat = 'double';

        async function loadSeasons() {
            try {
                const res = await fetch('/api/data/seasons');
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                const select = document.getElementById('season-select');
                const seasons = data.seasons || [];
                select.innerHTML = seasons.slice().reverse().map(s =>
                    `<option value="${s}">${s}</option>`
                ).join('');
                if (seasons.length > 0) {
                    currentSeason = seasons[seasons.length - 1];
                    select.value = currentSeason;
                }
            } catch (err) {
                console.error('加载赛季失败:', err);
            }
        }

        function getSelectedFormat() {
            const checked = document.querySelector('input[name="format"]:checked');
            return checked ? checked.value : 'double';
        }

        function onSeasonFormatChange() {
            currentSeason = document.getElementById('season-select').value;
            currentFormat = getSelectedFormat();
            loadData();
        }

        async function loadData() {
            const loading = document.getElementById('loading');
            loading.style.display = '';
            loading.textContent = '加载中...';
            loading.className = 'loading';
            document.getElementById('pokemon-grid').innerHTML = '';

            try {
                const url = `/api/data/pokemon-list?season=${encodeURIComponent(currentSeason)}&format=${encodeURIComponent(currentFormat)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || '请求失败');
                allPokemon = data.pokemon;
                document.getElementById('total-count').textContent = `共 ${allPokemon.length} 只`;
                loading.style.display = 'none';
                renderGrid(allPokemon);
            } catch (err) {
                loading.textContent = '加载失败: ' + err.message;
                loading.className = 'error';
            }
        }

        function renderGrid(list) {
            const grid = document.getElementById('pokemon-grid');
            grid.innerHTML = list.map(p => {
                const imgHtml = p.sprite
                    ? `<img src="/${p.sprite}" alt="${p.name_zh}" loading="lazy">`
                    : `<div class="no-img">-</div>`;
                const detailUrl = `/data/${p.slug}?season=${encodeURIComponent(currentSeason)}&format=${encodeURIComponent(currentFormat)}`;
                return `<a class="card" href="${detailUrl}" target="_blank">
                    <div class="idx">${p.index}</div>
                    <div class="sprite">${imgHtml}</div>
                    <div class="name" title="${p.slug}">${p.name_zh || p.slug}</div>
                </a>`;
            }).join('');
        }

        function filterList() {
            const q = document.getElementById('search').value.trim().toLowerCase();
            if (!q) {
                renderGrid(allPokemon);
                document.getElementById('total-count').textContent = `共 ${allPokemon.length} 只`;
                return;
            }
            const filtered = allPokemon.filter(p =>
                (p.name_zh && p.name_zh.toLowerCase().includes(q)) ||
                p.slug.toLowerCase().includes(q)
            );
            renderGrid(filtered);
            document.getElementById('total-count').textContent = `共 ${filtered.length} / ${allPokemon.length} 只`;
        }

        loadSeasons().then(() => loadData());
    </script>
</body>
</html>
